stages:
  - deploy

# ── onnex-claude-code — build + deploy to poc-backend ─────────────────────
#
# Runner:  shared-shell-runner (gitlab-runner-1, bash on linux/amd64)
#          Untagged — picked up by the instance shared runner.
# Server:  10.10.110.34  /opt/pocs/onnex-claude-code
# URL:     https://onnex-claude-code.poc.playsap.us
#
# Required GitLab CI/CD variables:
#   DEPLOY_SSH_KEY  — private key for mrt@10.10.110.34
# ──────────────────────────────────────────────────────────────────────────

variables:
  DEPLOY_HOST: "10.10.110.34"
  DEPLOY_USER: "mrt"
  DEPLOY_DIR:  "/opt/pocs/onnex-claude-code"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://onnex-claude-code.poc.playsap.us
  before_script:
    # Activate node via nvm (preinstalled on shared-shell-runner)
    - export NVM_DIR="$HOME/.nvm" && [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
    - nvm use 20 >/dev/null || nvm install 20
    - node --version && npm --version
    - command -v rsync >/dev/null || { echo "rsync missing on runner"; exit 1; }
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    # ── 1. Build ───────────────────────────────────────────────────────────
    - npm install --prefer-offline
    - npm run build
    # ── 2. Sync to server ─────────────────────────────────────────────────
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${DEPLOY_DIR}"
      rsync -az \
        dist \
        docker-compose.yml \
        Dockerfile.deploy \
        nginx.conf \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/"
      echo "[rsync] synced to ${DEPLOY_HOST}:${DEPLOY_DIR}"
    # ── 3. Rebuild + restart ───────────────────────────────────────────────
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} "
        set -e
        cd ${DEPLOY_DIR}
        docker compose up -d --build --remove-orphans
        docker image prune -f
        echo '=== Deploy complete ==='
        docker compose ps
      "
