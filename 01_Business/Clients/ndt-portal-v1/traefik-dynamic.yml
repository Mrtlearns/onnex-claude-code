http:
  routers:
    ut-api:
      rule: "PathPrefix(`/api/ut/quote`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-integrations:
      rule: "PathPrefix(`/api/ut/integrations`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-inspection-types:
      rule: "PathPrefix(`/api/ut/inspection-types`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-settings:
      rule: "PathPrefix(`/api/ut/settings`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-admin:
      rule: "PathPrefix(`/api/ut/admin`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-bom:
      rule: "PathPrefix(`/api/ut/bom`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-sf-analysis:
      rule: "PathPrefix(`/api/ut/sf-analysis`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-rt-machines:
      rule: "PathPrefix(`/api/ut/rt`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-rules:
      rule: "PathPrefix(`/api/ut/ut-rules`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    ut-calculate:
      rule: "PathPrefix(`/api/ut/calculate`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-ut-for-api]
      service: ut-api

    api-quotes:
      rule: "PathPrefix(`/api/quotes`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    rt-api:
      rule: "PathPrefix(`/api/rt/quote`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: rt-api

    postgrest-rt:
      rule: "PathPrefix(`/api/rt`)"
      priority: 20
      entryPoints: [web]
      middlewares: [strip-api-rt]
      service: postgrest-rt

    postgrest-ut:
      rule: "PathPrefix(`/api/ut`)"
      priority: 20
      entryPoints: [web]
      middlewares: [strip-api-ut]
      service: postgrest-ut

    msg-api:
      rule: "PathPrefix(`/api/msg`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-msg]
      service: msg-api

    comply-api:
      rule: "PathPrefix(`/api/pipeline/comply`)"
      priority: 35
      entryPoints: [web]
      middlewares: [strip-api-pipeline-comply]
      service: comply-api

    sanitize-api:
      rule: "PathPrefix(`/api/pipeline/sanitize`)"
      priority: 35
      entryPoints: [web]
      middlewares: [strip-api-pipeline-sanitize]
      service: sanitize-api

    gateway-api:
      rule: "PathPrefix(`/api/pipeline/gateway`)"
      priority: 35
      entryPoints: [web]
      middlewares: [strip-api-pipeline-gateway]
      service: gateway-api

    n8n:
      rule: "PathPrefix(`/n8n`)"
      priority: 10
      entryPoints: [web]
      middlewares: [strip-n8n]
      service: n8n

    documents-api:
      rule: "PathPrefix(`/api/documents`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    workshop-api:
      rule: "PathPrefix(`/api/workshop`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    rt-analyze:
      rule: "PathPrefix(`/api/rt/analyze`)"
      priority: 35
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    rbac-api:
      rule: "PathPrefix(`/api/rbac`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    feedback-api:
      rule: "PathPrefix(`/api/feedback`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    inbox-api:
      rule: "PathPrefix(`/api/inbox`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    diagram-analyses-api:
      rule: "PathPrefix(`/api/diagram-analyses`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    email-checks-api:
      rule: "PathPrefix(`/api/email-checks`)"
      priority: 30
      entryPoints: [web]
      middlewares: [strip-api-for-rt-api]
      service: ut-api

    authentik:
      rule: "PathPrefix(`/auth`)"
      priority: 50
      entryPoints: [web]
      middlewares: [strip-auth, set-https-proto]
      service: authentik-svc

    authentik-direct:
      rule: "PathPrefix(`/application/`) || PathPrefix(`/if/`) || PathPrefix(`/-/`) || PathPrefix(`/flows/`) || PathPrefix(`/ws/`) || PathPrefix(`/api/v3/`) || PathPrefix(`/static/dist/`)"
      priority: 45
      entryPoints: [web]
      middlewares: [set-https-proto]
      service: authentik-svc

    nginx:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [web]
      service: nginx

  middlewares:
    strip-api-ut-for-api:
      stripPrefix:
        prefixes: ["/api/ut"]
    strip-api-for-rt-api:
      stripPrefix:
        prefixes: ["/api"]
    strip-api-rt:
      stripPrefix:
        prefixes: ["/api/rt"]
    strip-api-ut:
      stripPrefix:
        prefixes: ["/api/ut"]
    strip-api-msg:
      stripPrefix:
        prefixes: ["/api/msg"]
    strip-n8n:
      stripPrefix:
        prefixes: ["/n8n"]
    strip-api-pipeline-comply:
      stripPrefix:
        prefixes: ["/api/pipeline/comply"]
    strip-api-pipeline-sanitize:
      stripPrefix:
        prefixes: ["/api/pipeline/sanitize"]
    strip-api-pipeline-gateway:
      stripPrefix:
        prefixes: ["/api/pipeline/gateway"]
    strip-auth:
      stripPrefix:
        prefixes: ["/auth"]
    set-https-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
    ut-api:
      loadBalancer:
        servers:
          - url: "http://api:3100"
    rt-api:
      loadBalancer:
        servers:
          - url: "http://api:3100"
    postgrest-rt:
      loadBalancer:
        servers:
          - url: "http://postgrest-rt:3000"
    postgrest-ut:
      loadBalancer:
        servers:
          - url: "http://postgrest-ut:3000"
    n8n:
      loadBalancer:
        servers:
          - url: "http://n8n:5678"
    msg-api:
      loadBalancer:
        servers:
          - url: "http://msg-api:8000"
    nginx:
      loadBalancer:
        servers:
          - url: "http://nginx:80"
    comply-api:
      loadBalancer:
        servers:
          - url: "http://comply:8010"
    sanitize-api:
      loadBalancer:
        servers:
          - url: "http://sanitize:8011"
    gateway-api:
      loadBalancer:
        servers:
          - url: "http://gateway:8012"
    authentik-svc:
      loadBalancer:
        servers:
          - url: "http://authentik:9000"
