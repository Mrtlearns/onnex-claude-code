---
# NDT Portal — Traefik + Nginx + Postgres + PostgREST-RT + PostgREST-UT + API
services:

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:8888
      - --log.level=INFO
    ports:
      - "8888:8888"
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ndtportal
      POSTGRES_USER: ndtapp
      POSTGRES_PASSWORD: Ndt@P0rtal2026!
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/01-migrate.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndtapp -d ndtportal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgrest-rt:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://ndtapp:Ndt%40P0rtal2026!@postgres:5432/ndtportal
      PGRST_DB_SCHEMAS: rt
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_SERVER_PORT: 3000

  postgrest-ut:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://ndtapp:Ndt%40P0rtal2026!@postgres:5432/ndtportal
      PGRST_DB_SCHEMAS: ut
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      PGRST_SERVER_PORT: 3000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_PATH: "/n8n/"
      # Public webhook URL — sourced from PORTAL_DOMAIN env var
      WEBHOOK_URL: "https://${PORTAL_DOMAIN:-ndt-v1.on-nex.us}/n8n/"
      # Stable encryption key for credentials — do not change after first start
      N8N_ENCRYPTION_KEY: "ndt-portal-n8n-key-2026-32chars"
      N8N_SECURE_COOKIE: "false"
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: "America/Chicago"
      EXECUTIONS_TIMEOUT: "300"
      EXECUTIONS_TIMEOUT_MAX: "3600"
      # NDT API internal URL (Docker network) — used by WF-6 to POST emails for processing
      NDT_API_URL: "http://api:3100"
      # Shared secret validated by /api/inbox/process to authenticate n8n webhook calls
      N8N_INTERNAL_SECRET: "${N8N_INTERNAL_SECRET}"
    volumes:
      - n8n_data:/home/node/.n8n

  msg-api:
    image: ndt-msg-api:latest
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MSG_API_BASE_URL: "/api/msg"

  # ── Pipeline services (comply / sanitize / gateway) ──────────────────────

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    restart: unless-stopped
    # Internal only — no Traefik exposure

  presidio-image-redactor:
    image: mcr.microsoft.com/presidio-image-redactor:latest
    restart: unless-stopped
    # Internal only — no Traefik exposure

  comply:
    image: ndt-comply:latest
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      PYTHONUNBUFFERED: "1"
      PG_DSN: "postgresql://ndtapp:Ndt%40P0rtal2026!@postgres:5432/ndtportal"
      PIPELINE_VAULT_KEY: "${PIPELINE_VAULT_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8010/health',timeout=3); sys.exit(0 if b'ok' in r.read() else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sanitize:
    image: ndt-sanitize:latest
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      PYTHONUNBUFFERED: "1"
      PG_DSN: "postgresql://ndtapp:Ndt%40P0rtal2026!@postgres:5432/ndtportal"
      PIPELINE_VAULT_KEY: "${PIPELINE_VAULT_KEY}"
      PRESIDIO_ANALYZER_URL: "http://presidio-analyzer:5001"
      PRESIDIO_IMAGE_REDACTOR_URL: "http://presidio-image-redactor:5002"
    depends_on:
      postgres:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8011/health',timeout=3); sys.exit(0 if b'ok' in r.read() else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    image: ndt-gateway:latest
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      PYTHONUNBUFFERED: "1"
      PG_DSN: "postgresql://ndtapp:Ndt%40P0rtal2026!@postgres:5432/ndtportal"
      PIPELINE_VAULT_KEY: "${PIPELINE_VAULT_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-ndt-v1.on-nex.us}
      OLLAMA_URL: "http://host.gateway.internal:11434"
      SANITIZE_URL: "http://sanitize:8011"
      API_URL: "http://api:3100"
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      N8N_EMAIL_REPLY_URL: "http://n8n:5678/webhook/ndt-email-reply"
      N8N_INTERNAL_SECRET: "${N8N_INTERNAL_SECRET}"
      AUTO_REPLY_OVERRIDE: "${AUTO_REPLY_OVERRIDE}"
    volumes:
      - ./claude-token-store:/claude-token-store:ro
    extra_hosts:
      - "host.gateway.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      sanitize:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8012/health',timeout=3); sys.exit(0 if b'ok' in r.read() else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    image: ndt-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ndtportal
      PGUSER: ndtapp
      PGPASSWORD: "Ndt@P0rtal2026!"
      # ── Integration secrets ───────────────────────────────────────
      # Salesforce — External Client App (client_credentials OAuth2)
      SF_INSTANCE_URL: "https://ndt.my.salesforce.com"
      SF_CLIENT_ID: "3MVG98XJQQAccJQfALhpE_TXrxUXql2ZMFlON2paJKn.tQppNon5kbrweTHjT_KNf_Jm9dUNwEDHNhk85HTEM"
      SF_CLIENT_SECRET: "F97AFD02A8765E085364E8BAC38A24F0124F7D45BF2AE055950F2AEC42B7D41F"
      SF_WEBHOOK_SECRET: ""
      # Email integration — API-based (Mailgun / SendGrid)
      EMAIL_API_KEY: ""
      EMAIL_FROM: "auto-quotes@ndtesting.com"
      EMAIL_WEBHOOK_SECRET: ""
      EMAIL_REPLY_TO: "auto-quotes@ndtesting.com"
      # Email integration — IMAP inbound (Microsoft 365 / Custom)
      IMAP_HOST: "outlook.office365.com"
      IMAP_PORT: "993"
      IMAP_SECURE: "true"
      IMAP_USER: "auto-quotes@ndtesting.com"
      IMAP_PASS: "V#073144840199ab"
      # Email integration — SMTP outbound
      SMTP_HOST: "smtp.office365.com"
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: "auto-quotes@ndtesting.com"
      SMTP_PASS: "V#073144840199ab"
      # n8n shared secret (used to validate X-N8N-Token header)
      N8N_WEBHOOK_SECRET: "ndt-n8n-secret-2026"
      # Shared secret for authenticating inbound n8n webhook calls to /api/inbox/process
      N8N_INTERNAL_SECRET: "${N8N_INTERNAL_SECRET}"
      # WF-5 pipeline orchestrator webhook URL
      # Use internal Docker service name — avoids TLS/self-signed cert issues and
      # Traefik body-parse failure when routing via the public URL.
      N8N_WF5_WEBHOOK_URL: "http://n8n:5678/webhook/ndt-pipeline"
      # WF-6 email inbox checker webhook URL
      N8N_EMAIL_CHECK_URL: "http://n8n:5678/webhook/ndt-email-check"
      # Nextcloud document storage
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-ndt-v1.on-nex.us}
      NEXTCLOUD_URL: http://nextcloud-app:80
      NEXTCLOUD_USER: ${NEXTCLOUD_ADMIN_USER:-ncadmin}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-ncadmin_dev_2024}
      COLLABORA_URL: http://collabora:9980
      NEXTCLOUD_PUBLIC_URL: ${NEXTCLOUD_PUBLIC_URL:-http://10.10.110.32:8090}
      # Authentik OIDC — used by JWT middleware to fetch JWKS for token verification
      # Internal Docker URL: avoids TLS cert issues and external DNS
      AUTHENTIK_ISSUER: "http://authentik:9000/application/o/ndt-portal/"
      # AI analytics — direct LLM calls from admin routes
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      # Internal service-to-service auth (gateway → API)
      INTERNAL_SECRET: "${INTERNAL_SECRET}"
      # Override auto-reply recipient (testing) — remove for production
      AUTO_REPLY_OVERRIDE: "${AUTO_REPLY_OVERRIDE}"
      # Pipeline service URLs (internal Docker network)
      COMPLY_URL: http://comply:8010
      SANITIZE_URL: http://sanitize:8011
      GATEWAY_URL: http://gateway:8012
    ports:
      - "3100:3100"
    volumes:
      - ./api/prompts:/app/prompts:ro   # prompt engineering without image rebuild
      - pdf-store:/pdf-store
      - ./claude-token-store:/claude-token-store
    depends_on:
      postgres:
        condition: service_healthy

  nextcloud-db:
    container_name: nextcloud-db
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_dev}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_dev}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nextcloud-redis:
    container_name: nextcloud-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nextcloud_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud-app:
    container_name: nextcloud-app
    image: nextcloud:30-apache
    restart: unless-stopped
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_dev}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-ncadmin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-ncadmin_dev_2024}
      NEXTCLOUD_TRUSTED_DOMAINS: "10.10.110.32 localhost"
      REDIS_HOST: nextcloud-redis
      REDIS_HOST_PORT: 6379
      OVERWRITEPROTOCOL: http
      OVERWRITEHOST: "10.10.110.32:8090"
    volumes:
      - nextcloud_html:/var/www/html
      - /mnt/nextcloud-data:/var/www/html/data
    ports:
      - "0.0.0.0:8090:80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      POSTGRES_DB: authentik
    volumes:
      - authentik_db_data:/var/lib/postgresql/data

  authentik-redis:
    image: redis:7-alpine
    restart: unless-stopped

  authentik:
    image: ghcr.io/goauthentik/server:2024.12
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_URL: "https://ndt-v1.on-nex.us"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    depends_on:
      - authentik-db
      - authentik-redis

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_URL: "https://ndt-v1.on-nex.us"
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
    depends_on:
      - authentik-db
      - authentik-redis

  collabora:
    container_name: collabora
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      - aliasgroup1=http://nextcloud-app
      - DONT_GEN_SSL_CERT=YES
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    cap_add:
      - MKNOD

volumes:
  pgdata:
    driver: local
  n8n_data:
    driver: local
  pdf-store:
    driver: local
  authentik_db_data:
    driver: local
  nextcloud_html: {}
  # nextcloud_data: migrated to bind-mount /mnt/nextcloud-data (sdb1, 40GB)
  nextcloud_db_data: {}
  nextcloud_redis_data: {}
