---
# NDT Portal v1 — GitLab CI/CD Pipeline
# Shell runner on ndtv1 — jobs run LOCALLY on the production server.
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   PIPELINE_VAULT_KEY   — 64-char hex, Protected+Masked
#   ANTHROPIC_API_KEY    — sk-ant-..., Protected+Masked (optional, can use OpenRouter)
#   OPENROUTER_API_KEY   — sk-or-v1-..., Protected+Masked
#
# One-time Ollama setup (manual on ndtv1 host):
#   curl -fsSL https://ollama.ai/install.sh | sh
#   ollama pull llama3.3:70b
#   systemctl enable ollama && systemctl start ollama

stages:
  - deploy

variables:
  DEPLOY_DIR: "/opt/ndt-portal"
  API_IMAGE:  "ndt-api:latest"

deploy:
  stage: deploy
  tags: [ndt-runner]
  environment:
    name: production
    url: https://ndt-v1.on-nex.us
  script:
    # ── 0. Detect what changed ─────────────────────────────────────────────
    - |
      CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "ALL")
      echo "Changed files: $CHANGED"
      echo "$CHANGED" | grep -qE '^api/(src|package.*\.json|tsconfig|Dockerfile)' && API_CHANGED=yes || API_CHANGED=no
      echo "$CHANGED" | grep -qE '^frontend/(src|package.*\.json|index\.html)'    && FRONT_CHANGED=yes || FRONT_CHANGED=no
      echo "$CHANGED" | grep -q '^pipeline/comply/'                               && COMPLY_CHANGED=yes  || COMPLY_CHANGED=no
      echo "$CHANGED" | grep -q '^pipeline/sanitize/'                             && SANITIZE_CHANGED=yes || SANITIZE_CHANGED=no
      echo "$CHANGED" | grep -q '^pipeline/gateway/'                              && GATEWAY_CHANGED=yes || GATEWAY_CHANGED=no
      # shared/ changes affect all services
      echo "$CHANGED" | grep -q '^pipeline/shared/' && COMPLY_CHANGED=yes && SANITIZE_CHANGED=yes && GATEWAY_CHANGED=yes || true
      # Force full build if first commit or change detection unavailable
      if [ "$CHANGED" = "ALL" ]; then
        API_CHANGED=yes; FRONT_CHANGED=yes; COMPLY_CHANGED=yes; SANITIZE_CHANGED=yes; GATEWAY_CHANGED=yes
      fi
      echo "Build flags — API:$API_CHANGED  FRONTEND:$FRONT_CHANGED  COMPLY:$COMPLY_CHANGED  SANITIZE:$SANITIZE_CHANGED  GATEWAY:$GATEWAY_CHANGED"

    # ── 1. Build pipeline images (per-service change detection) ───────────
    - |
      cd "$CI_PROJECT_DIR/pipeline"
      if [ "$COMPLY_CHANGED" = "yes" ]; then
        echo "Rebuilding comply image..."
        docker build -t ndt-comply:latest   -f comply/Dockerfile   .
      else
        echo "comply unchanged — skipping."
      fi
      if [ "$SANITIZE_CHANGED" = "yes" ]; then
        echo "Rebuilding sanitize image..."
        docker build -t ndt-sanitize:latest -f sanitize/Dockerfile .
      else
        echo "sanitize unchanged — skipping."
      fi
      if [ "$GATEWAY_CHANGED" = "yes" ]; then
        echo "Rebuilding gateway image..."
        docker build -t ndt-gateway:latest  -f gateway/Dockerfile  .
      else
        echo "gateway unchanged — skipping."
      fi
      cd "$CI_PROJECT_DIR"

    # ── 2. Build API Docker image (if api/ changed) ────────────────────────
    # Multi-stage build: node_modules layer cached when only src changes (~5s).
    # docker compose up -d detects the new image ID and recreates the container.
    - |
      if [ "$API_CHANGED" = "yes" ]; then
        echo "Building API image (ndt-api:latest)..."
        docker build -t "$API_IMAGE" "$CI_PROJECT_DIR/api/"
        echo "✓ API image built"
      else
        echo "API unchanged — skipping image build."
      fi

    # ── 3. Build frontend static bundle (if frontend/ changed) ────────────
    # Write .env.production so Vite bakes OIDC vars into the bundle.
    # VITE_* vars are public (client_id + issuer appear in browser network traffic).
    # .env.production is gitignored (.env.*), so we write it here at build time.
    - |
      {
        echo "VITE_AUTHENTIK_ISSUER=${VITE_AUTHENTIK_ISSUER:-https://ndt-v1.on-nex.us/application/o/ndt-portal/}"
        echo "VITE_AUTHENTIK_CLIENT_ID=${VITE_AUTHENTIK_CLIENT_ID:-ndt-portal-606dbe86-3d7}"
      } > "$CI_PROJECT_DIR/frontend/.env.production"
      echo "✓ frontend/.env.production written"
    - |
      if [ "$FRONT_CHANGED" = "yes" ]; then
        echo "Building frontend..."
        cd "$CI_PROJECT_DIR/frontend" && npm ci --prefer-offline && npm run build
        echo "✓ Frontend built"
      else
        echo "Frontend unchanged — skipping build."
      fi

    # ── 4. Sync config + static assets to DEPLOY_DIR ──────────────────────
    - sudo mkdir -p "$DEPLOY_DIR"
    - |
      if [ "$FRONT_CHANGED" = "yes" ]; then
        sudo rsync -rlDt --delete "$CI_PROJECT_DIR/dist/" "$DEPLOY_DIR/dist/"
      fi
    # Sync frontend source so the server copy stays current.
    # CI always builds from the git clone ($CI_PROJECT_DIR), but keeping the
    # server source in sync means manual server rebuilds work without stale code.
    # Excludes: node_modules (must be npm ci'd on server), dist (built separately),
    #           .env* (gitignored, written by CI at build time).
    - |
      sudo rsync -rlDt --delete \
        --exclude='node_modules/' \
        --exclude='dist/' \
        --exclude='.env*' \
        "$CI_PROJECT_DIR/frontend/" "$DEPLOY_DIR/frontend/"
      # Re-write .env.production after rsync (rsync excluded it above).
      # Write to /tmp first (no sudo needed), then sudo cp (allowed in sudoers).
      {
        echo "VITE_AUTHENTIK_ISSUER=${VITE_AUTHENTIK_ISSUER:-https://ndt-v1.on-nex.us/application/o/ndt-portal/}"
        echo "VITE_AUTHENTIK_CLIENT_ID=${VITE_AUTHENTIK_CLIENT_ID:-ndt-portal-606dbe86-3d7}"
      } > /tmp/ndt-frontend-env.production
      sudo cp /tmp/ndt-frontend-env.production "$DEPLOY_DIR/frontend/.env.production"
      rm /tmp/ndt-frontend-env.production
      echo "✓ Frontend source synced to $DEPLOY_DIR/frontend/"
    - sudo rsync -rlDt --delete "$CI_PROJECT_DIR/api/prompts/"         "$DEPLOY_DIR/api/prompts/"
    - sudo rsync -rlDt --delete "$CI_PROJECT_DIR/pipeline/migrations/" "$DEPLOY_DIR/pipeline/migrations/"
    - sudo rsync -rlDt          "$CI_PROJECT_DIR/pipeline/scripts/"    "$DEPLOY_DIR/pipeline/scripts/"
    - sudo cp "$CI_PROJECT_DIR/docker-compose.yml"  "$DEPLOY_DIR/docker-compose.yml"
    - sudo cp "$CI_PROJECT_DIR/traefik-dynamic.yml" "$DEPLOY_DIR/traefik-dynamic.yml"
    - sudo cp "$CI_PROJECT_DIR/nginx.conf"          "$DEPLOY_DIR/nginx.conf"
    - sudo mkdir -p "$DEPLOY_DIR/claude-token-store"

    # ── 5. Write .env (secrets from CI variables, never committed) ─────────
    # PIPELINE_VAULT_KEY: use CI variable if set; else preserve existing value;
    # else generate a fresh key so sanitize/gateway always start healthy.
    - |
      EXISTING_VAULT=$(grep -m1 '^PIPELINE_VAULT_KEY=' "$DEPLOY_DIR/.env" 2>/dev/null | cut -d= -f2-)
      RESOLVED_VAULT="${PIPELINE_VAULT_KEY:-${EXISTING_VAULT}}"
      if [ -z "$RESOLVED_VAULT" ]; then
        RESOLVED_VAULT=$(openssl rand -hex 32)
        echo "INFO: generated new PIPELINE_VAULT_KEY"
      fi
      {
        echo "PORTAL_DOMAIN=ndt-v1.on-nex.us"
        echo "PIPELINE_VAULT_KEY=${RESOLVED_VAULT}"
        echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
        echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}"
        echo "NEXTCLOUD_ADMIN_USER=ncadmin"
        echo "NEXTCLOUD_ADMIN_PASSWORD=ncadmin_dev_2024"
        echo "NEXTCLOUD_DB_PASSWORD=nextcloud_dev"
        echo "NEXTCLOUD_PUBLIC_URL=http://10.10.110.32:8090"
        echo "AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:-}"
        echo "AUTHENTIK_DB_PASSWORD=${AUTHENTIK_DB_PASSWORD:-}"
        echo "JWT_SECRET=${JWT_SECRET:-}"
      } > /tmp/ndt-portal.env
      sudo cp /tmp/ndt-portal.env "$DEPLOY_DIR/.env" && rm /tmp/ndt-portal.env

    # ── 6. DB migrations (idempotent) ─────────────────────────────────────
    - |
      PGCTR=$(docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -q postgres 2>/dev/null)
      if [ -n "$PGCTR" ]; then
        docker cp "$DEPLOY_DIR/pipeline/migrations/001_pipeline_schema.sql" "$PGCTR:/tmp/001.sql"
        docker compose -f "$DEPLOY_DIR/docker-compose.yml" exec -T postgres psql -U ndtapp -d ndtportal -f /tmp/001.sql 2>/dev/null || true
        docker cp "$CI_PROJECT_DIR/db/migrate.sql" "$PGCTR:/tmp/migrate.sql"
        docker compose -f "$DEPLOY_DIR/docker-compose.yml" exec -T postgres psql -U ndtapp -d ndtportal -f /tmp/migrate.sql 2>/dev/null || true
      else
        echo "Postgres not running yet — migrations will run on first startup."
      fi

    # ── 7. Start / update services ─────────────────────────────────────────
    # docker compose up -d auto-recreates containers whose image ID changed.
    # Retry on failure: handles two Docker race conditions:
    #   a) "removal already in progress" → leaves hash-prefixed container names
    #   b) "container name already in use" for explicitly-named containers
    #      (collabora, nextcloud-*) whose names aren't auto-suffixed by compose
    - cd "$DEPLOY_DIR"
    - |
      if ! docker compose up -d --remove-orphans; then
        echo "First compose up failed — force-removing stuck named containers and retrying"
        for cname in collabora nextcloud-app nextcloud-db nextcloud-redis; do
          docker rm -f "$cname" 2>/dev/null || true
        done
        docker compose down
        docker compose up -d
      fi
    - docker compose restart traefik

    # ── 7b. Authentik seed — apply idempotent config after services start ────
    # Ensures Authentik config survives a DB wipe + fresh setup.
    # Script is committed to git at authentik/seed.py.
    # Exits non-zero if provider not found yet (first deploy before setup) —
    # we suppress the failure with || true so it doesn't block the deploy.
    - |
      AUTHENTIK_CTR=$(docker compose ps -q authentik 2>/dev/null)
      if [ -n "$AUTHENTIK_CTR" ]; then
        echo "Running Authentik seed..."
        docker cp "$CI_PROJECT_DIR/authentik/seed.py" "$AUTHENTIK_CTR:/tmp/seed.py"
        docker compose exec -T authentik python /tmp/seed.py 2>&1 || true
        echo "✓ Authentik seed done"
      else
        echo "Authentik not running — skipping seed (run setup_authentik.js first)"
      fi

    # ── 8. Health check — poll instead of fixed sleep ──────────────────────
    - |
      echo "Polling API health..."
      for i in $(seq 1 30); do
        curl -sf http://localhost:3100/health > /dev/null && echo "✓ API ready (${i}s)" && break
        [ "$i" -eq 30 ] && echo "✗ API did not become healthy in 30s" && exit 1
        sleep 1
      done
    - curl -sf http://localhost:8888/ > /dev/null && echo "✓ Frontend OK"
    - curl -s http://localhost:3100/health > /dev/null && echo "✓ API health check via direct port OK"

