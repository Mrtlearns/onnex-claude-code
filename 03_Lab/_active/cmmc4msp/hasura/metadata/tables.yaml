      - id
      - artifact_id
      - control_definition_id
      - similarity_score
      - top_chunk_texts
      - generated_at
      - applied_at
      - applied_by
      filter:
        artifact:
          program_control:
            program:
              org_id:
                _eq: X-Hasura-Org-Id
      allow_aggregations: false
  insert_permissions:
  - role: super_admin
    permission:
      columns: "*"
      check: {}
  update_permissions:
  - role: super_admin
    permission:
      columns: "*"
      filter: {}
  - role: msp_admin
    permission:
      columns:
      - applied_at
      - applied_by
      filter:
        artifact:
          program_control:
            program:
              org:
                msp_id:
                  _eq: X-Hasura-Msp-Id
  - role: client_admin
    permission:
      columns:
      - applied_at
      - applied_by
      filter:
        artifact:
          program_control:
            program:
              org_id:
                _eq: X-Hasura-Org-Id
  delete_permissions:
  - role: super_admin
    permission:
      filter: {}
