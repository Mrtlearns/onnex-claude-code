version: '3.8'

# cmmc4msp — CMMC Compliance OS stack
# External MinIO on TrueNAS (10.10.20.30:9000) — no local MinIO container
# TLS terminated at traefik-a (10.10.30.35) — services run plain HTTP

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    labels: "container_name"

networks:
  cmmc-internal:
    driver: bridge
    internal: true
  cmmc-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  authentik_media:
  n8n_data:
  hasura_data:

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cmmc-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cmmc_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [cmmc-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d cmmc_main"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Cache / Queue ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cmmc-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks: [cmmc-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Identity Provider ─────────────────────────────────────────────────────
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: cmmc-authentik-server
    restart: unless-stopped
    logging: *default-logging
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@${BASE_DOMAIN}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASS}
      AUTHENTIK_COOKIE_DOMAIN: ${BASE_DOMAIN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DEFAULT_USER_CHANGE_EMAIL: "false"
      AUTHENTIK_DEFAULT_USER_CHANGE_USERNAME: "false"
    volumes:
      - authentik_media:/media
    ports:
      - "9000:9000"
    networks: [cmmc-internal, cmmc-public]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: cmmc-authentik-worker
    restart: unless-stopped
    logging: *default-logging
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik_media:/media
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [cmmc-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Workflow Engine ───────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cmmc-n8n
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXECUTIONS_MODE: regular
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASS}
      N8N_HOST: n8n.${BASE_DOMAIN}
      WEBHOOK_URL: http://n8n.${BASE_DOMAIN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: UTC
      N8N_LOG_LEVEL: info
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"
    networks: [cmmc-internal, cmmc-public]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: cmmc-fastapi
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cmmc_main
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_SVC_KEY}
      MINIO_SECRET_KEY: ${MINIO_SVC_SECRET}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      AUTHENTIK_URL: https://auth.${BASE_DOMAIN}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      N8N_WF_ONBOARD: ${N8N_WF_ONBOARD:-}
      N8N_WF_ARTIFACT: ${N8N_WF_ARTIFACT:-}
      N8N_WF_REPORT: ${N8N_WF_REPORT:-}
      N8N_WF_ASSIGN_NOTIFY: ${N8N_WF_ASSIGN_NOTIFY:-}
      N8N_WF_USER_INVITE: ${N8N_WF_USER_INVITE:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      N8N_INTERNAL_URL: http://n8n:5678
      APP_URL: https://app.${BASE_DOMAIN}
    ports:
      - "8000:8000"
    networks: [cmmc-internal, cmmc-public]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── GraphQL API ───────────────────────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.42.0
    container_name: cmmc-hasura
    restart: unless-stopped
    logging: *default-logging
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cmmc_main
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hasura_meta
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"RS256","jwk_url":"http://authentik-server:9000/application/o/cmmc4msp/jwks/"}'
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      HASURA_GRAPHQL_LOG_LEVEL: warn
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log
    ports:
      - "8080:8080"
    networks: [cmmc-internal, cmmc-public]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend ──────────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ./nextjs
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_HASURA_URL: https://gql.cmmc4msp.on-nex.us
        NEXT_PUBLIC_HASURA_WS_URL: wss://gql.cmmc4msp.on-nex.us
        NEXT_PUBLIC_API_URL: https://api.cmmc4msp.on-nex.us
        NEXT_PUBLIC_AUTHENTIK_ISSUER: https://auth.cmmc4msp.on-nex.us/application/o/cmmc4msp/
    container_name: cmmc-nextjs
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_HASURA_URL: https://gql.${BASE_DOMAIN}
      NEXT_PUBLIC_HASURA_WS_URL: wss://gql.${BASE_DOMAIN}
      NEXT_PUBLIC_API_URL: https://api.${BASE_DOMAIN}
      NEXTAUTH_URL: https://app.${BASE_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CMMC_CLIENT_ID:-placeholder}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CMMC_CLIENT_SECRET:-placeholder}
      AUTHENTIK_ISSUER: https://auth.${BASE_DOMAIN}/application/o/cmmc4msp/
      NEXT_PUBLIC_AUTHENTIK_ISSUER: https://auth.${BASE_DOMAIN}/application/o/cmmc4msp/
      HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_INTERNAL_URL: http://hasura:8080/v1/graphql
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    networks: [cmmc-internal, cmmc-public]
    depends_on:
      - fastapi
      - hasura
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
