apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-api
  namespace: aios
  labels:
    app: aios-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aios-api
  template:
    metadata:
      labels:
        app: aios-api
    spec:
      containers:
        - name: aios-api
          image: aios-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aios-api-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-api-secrets
                  key: OPENAI_API_KEY
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aios-api-secrets
                  key: AUTHENTIK_CLIENT_SECRET
            - name: AUTHENTIK_OIDC_URL
              valueFrom:
                configMapKeyRef:
                  name: aios-api-config
                  key: AUTHENTIK_OIDC_URL
            - name: TEMPORAL_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: aios-api-config
                  key: TEMPORAL_ADDRESS
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
