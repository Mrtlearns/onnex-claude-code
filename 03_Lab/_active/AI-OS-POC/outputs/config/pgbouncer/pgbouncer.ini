[databases]
aios = host=postgres-core port=5432 dbname=aios user=aios password=aios_dev_password
n8n = host=postgres-core port=5432 dbname=n8n user=aios password=aios_dev_password

[pgbouncer]
listen_addr = *
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 300
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
ignore_startup_parameters = extra_float_digits,search_path,statement_timeout
