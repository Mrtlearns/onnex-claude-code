services:
  agentsec:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-sentinel-agentsec
    restart: unless-stopped
    env_file:
      - ./infra/env
    environment:
      - AI_SENTINEL_PRESIDIO_URL=http://presidio:3000
      - AI_SENTINEL_STORE_BACKEND=memory
    ports:
      # Public — NPM (or whatever reverse proxy fronts on-nex.us) forwards here.
      # Basic auth on /dashboard + /admin/* is enforced by the axum app itself
      # (see ai-sentinel-api/src/auth_helpers.rs and middleware in main.rs).
      - "8080:8080"
    depends_on:
      - presidio
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentinel-net

  presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: ai-sentinel-presidio
    restart: unless-stopped
    networks:
      - sentinel-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-sentinel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ai_sentinel
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=${AI_SENTINEL_DB_PASSWORD:-sentinel_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-sentinel-redis
    restart: unless-stopped
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai-sentinel-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - sentinel-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-prometheus.rule=Host(`ai-sentinel.on-nex.us`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.sentinel-prometheus.entrypoints=websecure"
      - "traefik.http.routers.sentinel-prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai-sentinel-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${AI_SENTINEL_GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - sentinel-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-grafana.rule=Host(`ai-sentinel.on-nex.us`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.sentinel-grafana.entrypoints=websecure"
      - "traefik.http.routers.sentinel-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-grafana.loadbalancer.server.port=3000"

  sentinel-tester:
    build:
      context: ./sentinel-tester
      dockerfile: Dockerfile
    container_name: ai-sentinel-tester
    restart: unless-stopped
    environment:
      - AGENTSEC_URL=http://agentsec:8080
    ports:
      - "8090:8090"
    depends_on:
      - agentsec
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  sentinel-net:
    driver: bridge
