[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel-sdk"
version = "1.0.0"
description = "Python SDK for AI-Sentinel - the 8-layer LLM agent security sidecar"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "llm", "security", "agent", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
async = ["httpx[asyncio]>=0.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.25", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_sentinel_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
