[package]
name = "ai-sentinel-testmode"
version = "0.1.0"
edition = "2021"
description = "Dev-only testing surface: implements the Onnex Armory v1.0 HTTP contract. Gated behind ai-sentinel-api's `testmode` feature so it's excluded from production builds."

[dependencies]
ai-sentinel-core = { path = "../ai-sentinel-core" }
ai-sentinel-rules = { path = "../ai-sentinel-rules" }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sqlx = { workspace = true }
parking_lot = "0.12"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }
