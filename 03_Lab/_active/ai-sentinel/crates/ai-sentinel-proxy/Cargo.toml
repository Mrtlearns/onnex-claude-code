[package]
name = "ai-sentinel-proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ai-sentinel-proxy"
path = "src/main.rs"

[dependencies]
ai-sentinel-core = { path = "../ai-sentinel-core" }
ai-sentinel-layers = { path = "../ai-sentinel-layers" }
ai-sentinel-feed = { path = "../ai-sentinel-feed" }
ai-sentinel-store = { path = "../ai-sentinel-store" }
ai-sentinel-classifier = { path = "../ai-sentinel-classifier" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
ipnet = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
regex = { workspace = true }
time = { version = "0.3", features = ["std"] }
