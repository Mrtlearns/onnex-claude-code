# AI-Sentinel enterprise profile — all layers, Postgres, OpenTelemetry
host = "0.0.0.0"
port = 8080
log_level = "info"
store_backend = "postgres"
telemetry_level = "full"
telemetry_backend = "otlp"
telemetry_pii_redact = true
feed_interval_secs = 900

rate_max_actions_per_hour = 10000
rate_max_cost_per_day = 1000.0
rate_max_tokens_per_request = 200000

layer_l0_enabled = true
layer_l1_enabled = true
layer_l2_enabled = true
layer_l3_enabled = true
layer_l4_enabled = true
layer_l5_enabled = true
layer_l6_enabled = true
layer_l7_enabled = true
