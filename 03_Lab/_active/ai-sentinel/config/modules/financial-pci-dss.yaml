module: financial-pci-dss
version: 1
license_tier: enterprise
description: |
  PCI-DSS rule set. Blocks cardholder data (PAN, CVV, full track), bank routing/account
  numbers, IBAN/SWIFT codes, and forces audit logging on any attempt.

rules:
  - name: block-pan
    trigger: prompt_ingress
    priority: 100
    conditions:
      any_of:
        - regex: "\\b4\\d{3}[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{4}\\b"
        - regex: "\\b5[1-5]\\d{2}[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{4}\\b"
        - regex: "\\b3[47]\\d{2}[ -]?\\d{6}[ -]?\\d{5}\\b"
    actions:
      - type: reject
        user_message: "Cardholder data (PAN) detected and blocked per PCI-DSS."
        audit_tag: pci-pan-blocked
        severity: critical

  - name: block-cvv
    trigger: prompt_ingress
    priority: 95
    conditions:
      any_of:
        - regex: "(?i)\\bcvv?\\s*[:=]\\s*\\d{3,4}\\b"
        - regex: "(?i)\\b(security code|cvc|cv2)\\s*[:=]\\s*\\d{3,4}\\b"
    actions:
      - type: reject
        user_message: "CVV data cannot be sent to AI services under PCI-DSS."
        audit_tag: pci-cvv-blocked
        severity: critical

  - name: block-routing-account-egress
    trigger: prompt_egress
    priority: 88
    description: >-
      US bank routing numbers are exactly 9 digits (ABA format); paired with an account
      number this is enough to ACH-pull funds. Block both directions.
    conditions:
      any_of:
        - regex: "(?i)\\brouting\\s*(?:#|number|num)?\\s*[:=]?\\s*\\d{9}\\b"
        - regex: "(?i)\\baccount\\s*(?:#|number|num)?\\s*[:=]?\\s*\\d{6,12}\\b"
    actions:
      - type: redact
        replacement: "[BANK-INFO]"
        audit_tag: pci-bank-info-redacted

  - name: block-iban-swift-egress
    trigger: prompt_egress
    priority: 88
    description: >-
      IBAN: 2-letter country + 2 check digits + up to 30 alphanumerics (max 34 chars
      total). SWIFT/BIC: 8 or 11 chars, [A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?.
    conditions:
      any_of:
        - regex: "\\b[A-Z]{2}\\d{2}[A-Z0-9]{11,30}\\b"
        - regex: "\\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\\b"
    actions:
      - type: redact
        replacement: "[IBAN-OR-SWIFT]"
        audit_tag: pci-iban-swift-redacted

  - name: block-pan-egress
    trigger: prompt_egress
    priority: 90
    conditions:
      any_of:
        - regex: "\\b(?:\\d[ -]*?){13,16}\\b"
    actions:
      - type: reject
        user_message: "Outbound content contained card-number-shaped data."
        audit_tag: pci-pan-egress-blocked
        severity: high
