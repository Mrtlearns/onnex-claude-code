module: education-k12
version: 1
license_tier: pro
description: |
  K-12 school rule set. Blocks direct homework-completion requests, redacts student PII
  in egress responses, restricts after-hours access, and blocks self-harm escalation.

rules:
  - name: block-homework-completion
    trigger: prompt_ingress
    priority: 100
    description: >-
      Schools want students to learn with AI, not have AI do the work. Reject direct
      "do my homework" phrasing. Research-phrased questions still pass.
    conditions:
      any_of:
        - regex: "(?i)\\b(solve|complete|finish|do|write|generate) (my|the) (homework|assignment|essay|paper|project|exam)\\b"
        - regex: "(?i)\\b(give|show) (me|us) (the )?(answers?|solutions?) (to|for) (the )?(homework|assignment|exam)\\b"
    actions:
      - type: reject
        user_message: "This assistant supports research. Please formulate a question about the topic instead of asking for the finished work."
        audit_tag: k12-homework-blocked
        severity: medium

  - name: age-inappropriate-content-block
    trigger: prompt_ingress
    priority: 95
    conditions:
      any_of:
        - regex: "(?i)\\b(explicit|sexual|pornographic|violent)\\b.{0,40}\\b(image|story|content|scene)\\b"
        - regex: "(?i)\\b(how to (make|build|synthesize)) (a )?(bomb|explosive|weapon|drug)\\b"
    actions:
      - type: reject
        user_message: "This content isn't supported in a K-12 context."
        audit_tag: k12-age-inappropriate
        severity: high

  - name: self-harm-safety-escalation
    trigger: prompt_ingress
    priority: 98
    description: >-
      Self-harm or suicide ideation patterns: refuse to engage with the original prompt
      and surface the standard youth crisis-line response. The reject body is the
      response the user will see — keep it action-oriented.
    conditions:
      any_of:
        - regex: "(?i)\\b(suicide|kill myself|end my life|hurt myself|self[- ]?harm)\\b"
        - regex: "(?i)\\b(how (do|can) i die|painless way to)\\b"
    actions:
      - type: reject
        user_message: "I'm not able to help with that here. If you're in crisis in the US, text or call 988 (Suicide & Crisis Lifeline) — they're free, confidential, and available 24/7. If you're somewhere else, please tell a trusted adult or contact your local emergency line."
        audit_tag: k12-self-harm-redirect
        severity: critical

  - name: redact-student-names-egress
    trigger: prompt_egress
    priority: 50
    conditions:
      any_of:
        - regex_named_capture:
            pattern: "(?i)\\bstudent[:\\s]+(?P<name>[A-Z][a-z]+(?:\\s+[A-Z][a-z]+){1,2})\\b"
            group: name
    actions:
      - type: redact
        replacement: "[STUDENT]"
        audit_tag: k12-student-name-redacted

  - name: after-hours-soft-limit
    trigger: session_start
    priority: 20
    description: "Outside school hours (22:00-06:00 UTC), warn rather than block — supports homework-adjacent work."
    conditions:
      all_of:
        - time_of_day: { from: "22:00", to: "06:00" }
    actions:
      - type: warn
        message: "You're using the school assistant outside school hours — your session is being logged."
