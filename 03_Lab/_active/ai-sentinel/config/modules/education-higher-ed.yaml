module: education-higher-ed
version: 1
license_tier: pro
description: |
  Higher education rule set. Permits research and analytical work; warns on direct
  assignment copying, blocks fabricated citations, and flags exam-related prompts.

rules:
  - name: warn-direct-copy
    trigger: prompt_ingress
    priority: 80
    conditions:
      any_of:
        - regex: "(?i)\\b(write|produce) (me|us) (a|an) (essay|paper|thesis|dissertation)\\b"
        - regex: "(?i)\\bcopy[- ]?pasteable (version|answer)\\b"
    actions:
      - type: warn
        message: "Note: submitting AI-generated text as your own is plagiarism under most institutional policies."

  - name: block-fabricated-citations
    trigger: prompt_ingress
    priority: 90
    description: >-
      AI-fabricated citations are a major academic-integrity hazard. Reject prompts that
      explicitly ask to invent or hallucinate references.
    conditions:
      any_of:
        - regex: "(?i)\\b(make up|invent|fabricate|hallucinate) (a |some )?(citations?|references?|sources?|bibliograph(y|ies))\\b"
        - regex: "(?i)\\b(fake|fictional|plausible[- ]sounding) (citations?|references?|sources?)\\b"
    actions:
      - type: reject
        user_message: "Fabricating citations would violate academic integrity. Ask for help finding real, verifiable sources instead."
        audit_tag: highered-fake-citations
        severity: high

  - name: block-bypass-plagiarism-detection
    trigger: prompt_ingress
    priority: 90
    conditions:
      any_of:
        - regex: "(?i)\\b(bypass|evade|defeat|trick|fool) (turnitin|plagiarism|ai detection|gptzero)\\b"
        - regex: "(?i)\\b(rewrite|paraphrase) (to|so it) (?:beats|passes|avoids) (plagiarism|detection)\\b"
    actions:
      - type: reject
        user_message: "I can't help defeat academic-integrity tooling. I can help you understand a source and write in your own voice."
        audit_tag: highered-bypass-detection
        severity: high

  - name: research-scope-ok
    trigger: prompt_ingress
    priority: 10
    conditions:
      any_of:
        - regex: "(?i)\\b(explain|analyze|compare|contrast|summarize|derive|critique)\\b"
    actions:
      - type: allow

  - name: flag-exam-terms
    trigger: prompt_ingress
    priority: 60
    conditions:
      any_of:
        - regex: "(?i)\\b(take[- ]home|closed[- ]book|proctored|final) (exam|test)\\b"
    actions:
      - type: warn
        message: "This session has been tagged as potentially exam-related for instructor review."
