module: corporate-default
version: 1
license_tier: basic
description: |
  Corporate baseline rule set. Blocks obvious secrets leakage, strict egress PII, blocks
  internal-confidential markers, prevents prompt-injection bypass, and rate-limits cost.

rules:
  - name: block-secrets-ingress
    trigger: prompt_ingress
    priority: 100
    conditions:
      any_of:
        - regex: "(?i)\\b(AKIA|ASIA)[A-Z0-9]{16}\\b"
        - regex: "(?i)\\bghp_[A-Za-z0-9]{36,}\\b"
        - regex: "(?i)\\bsk-(?:proj-|ant-)?[A-Za-z0-9_\\-]{30,}\\b"
        - regex: "(?i)(-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----)"
    actions:
      - type: reject
        user_message: "This request appears to contain a credential or secret and has been blocked."
        audit_tag: corp-secret-blocked
        severity: critical

  - name: block-confidential-marker-egress
    trigger: prompt_egress
    priority: 90
    description: >-
      Catches the common case where an internal doc was pasted into the prompt and the
      LLM repeats classification markers in its response.
    conditions:
      any_of:
        - regex: "(?i)\\b(confidential|internal use only|company confidential|attorney[- ]client privileged|trade secret)\\b"
    actions:
      - type: redact
        replacement: "[CONFIDENTIAL]"
        audit_tag: corp-confidential-egress

  - name: block-prompt-injection-override
    trigger: prompt_ingress
    priority: 95
    conditions:
      any_of:
        - regex: "(?i)\\bignore (all |any |the )?(previous |prior |above )?(instructions|prompts?|rules)\\b"
        - regex: "(?i)\\bdisregard (all |the )?(system|prior) (prompt|instructions)\\b"
        - regex: "(?i)\\byou are now (DAN|unrestricted|jailbroken|developer mode)\\b"
    actions:
      - type: reject
        user_message: "Prompt-injection pattern detected; the assistant is following its configured instructions."
        audit_tag: corp-injection-blocked
        severity: high

  - name: strict-egress-pii
    trigger: prompt_egress
    priority: 80
    conditions:
      any_of:
        - regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
        - regex: "\\b(?:\\d[ -]*?){13,16}\\b"
        - regex: "(?i)\\b(password|pwd|passwd)\\s*[:=]\\s*\\S+"
    actions:
      - type: redact
        replacement: "[REDACTED]"
        audit_tag: corp-egress-pii

  - name: cost-guardrail
    trigger: cost_threshold
    priority: 50
    conditions:
      cost_gt: 5.0
    actions:
      - type: warn
        message: "Per-session LLM spend above $5 — operator notification sent."
