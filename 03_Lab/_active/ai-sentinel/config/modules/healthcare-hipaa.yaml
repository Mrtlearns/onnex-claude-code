module: healthcare-hipaa
version: 1
license_tier: enterprise
description: |
  HIPAA-aware rule set. Blocks PHI patterns in ingress/egress, refuses non-BAA providers,
  blocks unsolicited clinical advice, and redacts prescriber DEA numbers.

rules:
  - name: block-phi-ingress
    trigger: prompt_ingress
    priority: 100
    conditions:
      any_of:
        - regex: "(?i)\\bmrn\\s*[:#]?\\s*\\d{6,}\\b"
        - regex: "(?i)\\b(patient|pt)\\s+name\\s*[:=]"
        - regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
        - regex: "(?i)\\b(diagnos(ed|is)|icd[- ]?10)\\b"
    actions:
      - type: reject
        user_message: "Protected Health Information (PHI) detected and blocked per HIPAA safeguards."
        audit_tag: hipaa-phi-blocked
        severity: critical

  - name: phi-egress-redact
    trigger: prompt_egress
    priority: 90
    conditions:
      any_of:
        - regex: "(?i)\\bmrn\\s*[:#]?\\s*\\d{6,}\\b"
        - regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    actions:
      - type: redact
        replacement: "[PHI]"
        audit_tag: hipaa-phi-egress-redacted

  - name: block-dea-number-egress
    trigger: prompt_egress
    priority: 90
    description: >-
      DEA registration numbers follow a strict format (2 letters + 7 digits, last digit
      a checksum). Even an inadvertent disclosure must not leave the boundary.
    conditions:
      any_of:
        - regex: "(?i)\\b(dea\\s*(?:number|#|num)?\\s*[:=]?\\s*)?[A-Z]{2}\\d{7}\\b"
    actions:
      - type: redact
        replacement: "[DEA]"
        audit_tag: hipaa-dea-redacted

  - name: refuse-clinical-decision-advice
    trigger: prompt_ingress
    priority: 75
    description: >-
      Patients asking the assistant for medical decisions (dosage, diagnosis, prescribing).
      Refuse and redirect to a clinician — this is also FDA-aligned.
    conditions:
      any_of:
        - regex: "(?i)\\b(should i (take|stop|increase|decrease)) [a-z]+\\b"
        - regex: "(?i)\\b(diagnose|am i having) (a |an )?(stroke|heart attack|cancer|sepsis)\\b"
        - regex: "(?i)\\b(safe (dose|dosage)|maximum dose) (of|for) [a-z]+\\b"
    actions:
      - type: reject
        user_message: "I can't make clinical decisions for you. Please contact your clinician or, in an emergency, call your local emergency number."
        audit_tag: hipaa-clinical-refusal
        severity: high

  - name: baa-only-providers
    trigger: tool_call
    priority: 70
    description: >-
      Rust regex has no negative look-ahead, so this enumerates known non-BAA providers
      to block. Keep this list synced with the BAA-approved provider registry.
    conditions:
      any_of:
        - regex: "(?i)provider\\s*=\\s*(openai-public|anthropic-public|google-public|groq|together|mistral-public|ollama-local)"
    actions:
      - type: reject
        user_message: "Only providers with a signed BAA are permitted."
        audit_tag: hipaa-no-baa
        severity: high
