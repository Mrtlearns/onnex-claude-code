[workspace]
resolver = "2"
members = [
    "crates/ai-sentinel-core",
    "crates/ai-sentinel-layers",
    "crates/ai-sentinel-feed",
    "crates/ai-sentinel-store",
    "crates/ai-sentinel-api",
    "crates/ai-sentinel-classifier",
    "crates/ai-sentinel-proxy",
    "crates/ai-sentinel-modules",
    "crates/ai-sentinel-rules",
    "crates/ai-sentinel-optimizer",
    "crates/ai-sentinel-context",
]
# ai-sentinel-dashboard is a wasm-targeted crate built independently with `trunk build`.
# It's excluded from the workspace so `cargo build --workspace` doesn't try to compile it
# with the native target. Build it with: `cd crates/ai-sentinel-dashboard && trunk build --release`
exclude = [
    "crates/ai-sentinel-dashboard",
]

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP
axum = { version = "0.7", features = ["json", "tower-log", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "auth"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
jsonwebtoken = "9"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Regex
regex = "1"
fancy-regex = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Scheduling
tokio-cron-scheduler = "0.11"

# Session store
dashmap = "6"
deadpool-redis = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "json"] }
lru = "0.12"

# YAML + serialization for rules engine / compiled IR
serde_yaml = "0.9"
bincode = "1.3"
smallvec = { version = "1.13", features = ["serde"] }

# Rules engine benchmarks
criterion = { version = "0.5", features = ["async_tokio"] }

# Metrics
prometheus-client = "0.22"

# OpenAPI
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }

# Config
config = "0.14"
toml = "0.8"

# TLS / Proxy (gateway crate)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["pem"] }

# Network / IP
ipnet = { version = "2", features = ["serde"] }
blake3 = "1"

# Atomic swap (hot-reload)
arc-swap = "1"

# OpenTelemetry
opentelemetry = "0.24"
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
