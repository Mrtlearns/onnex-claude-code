services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    container_name: ai-maturity-compass-app
    ports:
      - "3100:80"
    restart: unless-stopped
    networks:
      - poc-net
      - supabase_default

networks:
  poc-net:
    external: true
  supabase_default:
    external: true
