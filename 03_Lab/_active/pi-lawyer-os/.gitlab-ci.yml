stages:
  - lint
  - build
  - test
  - deploy

variables:
  DEPLOY_HOST: "10.10.110.33"
  DEPLOY_USER: "root"
  DEPLOY_DIR: "/opt/pi-lawyer-os"

# ── Lint — TypeScript check (frontend only) ───────────────────────────────
frontend-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        - frontend/**/*

# ── Build — all services on server (no DinD required) ────────────────────
# Simpler than push/pull: server pulls git then builds locally.
# Runs only on main; build is embedded in deploy step below.

# ── Test — Playwright E2E ─────────────────────────────────────────────────
playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.50.0-jammy
  script:
    - cd playwright-tests
    - npm ci --prefer-offline
    - npx playwright test --reporter=junit
  artifacts:
    reports:
      junit: playwright-tests/test-results/junit.xml
    paths:
      - playwright-tests/test-results/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false
  needs:
    - frontend-lint

# ── Deploy — SSH pull + build + up ───────────────────────────────────────
deploy-production:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} "
        set -e
        cd ${DEPLOY_DIR}
        git pull origin main
        docker compose build frontend auth ai files
        docker compose up -d --remove-orphans
        docker compose restart postgrest
        docker image prune -f
        echo '=== Deploy complete ==='
        docker compose ps
      "
  environment:
    name: production
    url: http://$DEPLOY_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - playwright

# ── Health check — confirms stack is up after deploy ─────────────────────
health-check:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl
  script:
    - sleep 20
    - curl -sf "http://${DEPLOY_HOST}/auth/health" || exit 1
    - curl -sf "http://${DEPLOY_HOST}/api/" -H "Accept:application/json" || exit 1
    - echo "Health checks passed"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - deploy-production
